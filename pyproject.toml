readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "nltk>=3.8",
    "weasyprint>=62.0",
    "matplotlib>=3.8",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "requests>=2.31",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.29",
    "django-environ>=0.11",
    "transformers>=4.38",
    "torch>=2.2",
    "emoji>=2.10",
]
